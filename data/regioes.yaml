# Regiões → municípios.
#
# Usado quando `localizacao.regiao` está preenchida em criteria.yaml: os
# portais são consultados por estado e os resultados filtrados por esta lista.
# A comparação ignora acentos e maiúsculas, então "sao jose" casa com
# "São José". Para adicionar uma região, basta acrescentar uma chave aqui.

vale do paraiba:
  uf: SP
  municipios:
    - Aparecida
    - Arapeí
    - Areias
    - Bananal
    - Caçapava
    - Cachoeira Paulista
    - Campos do Jordão
    - Canas
    - Cruzeiro
    - Cunha
    - Guaratinguetá
    - Igaratá
    - Jacareí
    - Jambeiro
    - Lagoinha
    - Lavrinhas
    - Lorena
    - Monteiro Lobato
    - Natividade da Serra
    - Paraibuna
    - Pindamonhangaba
    - Piquete
    - Potim
    - Queluz
    - Redenção da Serra
    - Roseira
    - Santa Branca
    - Santo Antônio do Pinhal
    - São Bento do Sapucaí
    - São José do Barreiro
    - São José dos Campos
    - São Luiz do Paraitinga
    - Silveiras
    - Taubaté
    - Tremembé
    # Sul de Minas, lado mineiro da Mantiqueira (2026-10-13, pedido do dono).
    # Mantidos aqui, na mesma região, e não numa região nova, porque
    # `regiao: vale do paraiba` é a chave que outras partes do código leem
    # (ex. polos do Marketplace em sources/facebook.py). "Cruz Vera" não é
    # município, é distrito de Brazópolis -- os dois nomes entram porque
    # o anúncio pode trazer qualquer um. "Luminoso" não existe como município
    # em MG (o único resultado é uma estrada em Diamantina) e ficou de fora.
    - Paraisópolis
    - Consolação
    - Gonçalves
    - Sapucaí-Mirim
    - Brazópolis
    - Cruz Vera

# Perímetro da busca de leilões (2026-10-30, pedido do dono): do Alto Tietê
# (Mogi das Cruzes, oeste) a Cunha (leste), de Paraisópolis (norte) ao litoral
# de Ubatuba (sul). É o "vale do paraiba" acima MAIS o que o perímetro acrescenta;
# a lista completa está aqui, explícita, para poder ser conferida município a
# município. Decisões de borda, para o dono confirmar:
#   incluídos no limite: Santa Isabel (oeste), Wenceslau Braz e Camanducaia (MG,
#     norte/oeste), Caraguatatuba (sul, entre Ubatuba e o resto do litoral);
#   fora de propósito: Suzano, Arujá, Itaquaquecetuba (a oeste de Mogi), Nazaré
#     Paulista e Joanópolis (noroeste), Delfim Moreira e Itajubá (ao norte de
#     Paraisópolis), São Sebastião e Ilhabela (ao sul de Ubatuba), Paraty (RJ).
#   Os municípios do vale entre Aparecida e Bananal (leste de Cunha) ficam, pois
#     já faziam parte da região principal.
# "São Francisco Xavier" é distrito de São José dos Campos, listado por poder
# aparecer como "município" em anúncios.
perimetro leilao:
  uf: SP
  municipios:
