# Terreno — critérios ajustáveis da busca.
#
# Só o que muda de uma busca para outra fica aqui: tamanho, preço e localização.
# O *perfil* do imóvel procurado (água, benfeitorias, sossego, acesso, solo,
# mata, topografia, documentação) é estrutural e está em terreno/scoring.py,
# com pesos versionados e testáveis.

# ---------------------------------------------------------------- localização
# Preencha na granularidade que quiser:
#   estados   — obrigatório, dirige a busca nos portais
#   regiao    — opcional; se preenchida, filtra pelos municípios de data/regioes.yaml
#   municipios— opcional; se vazio, busca a região inteira (ou o estado inteiro)
localizacao:
  estados: [SP]
  regiao: "vale do paraiba"     # null para o estado inteiro
  municipios: []                # ex: [Monteiro Lobato, São Bento do Sapucaí]

  # Filtro por raio a partir de um ponto (opcional). null desliga.
  centro: null                  # ex: "Monteiro Lobato, SP"
  raio_km: 60

# ---------------------------------------------------------------- tamanho
# Sempre em hectares. A conversão cuida do alqueire, que varia por estado:
#   alqueire paulista  = 2,42 ha   (SP, PR, RJ)
#   alqueire mineiro   = 4,84 ha   (MG, GO, BA — o dobro do paulista)
#   alqueire do norte  = 2,72 ha   (AM)
#   tarefa             = 0,3025 ha (BA e Nordeste)
area:
  min_ha: 2
  max_ha: 10

# ---------------------------------------------------------------- preço
preco:
  min: 100000
  max: 2000000

# Teto opcional de R$ por hectare. null = sem teto.
max_preco_por_ha: null

# ---------------------------------------------------------------- fontes
fontes:
  olx: true
  vivareal: true
  mercadolivre: true
  chavesnamao: true
  imovelweb: true
  pgfn: true          # leilões da PGFN (comprei.pgfn.gov.br) — ver nota nos perfis
  brave: true
  facebook: true

# Onde cada fonte roda. Medido, não suposto: OLX, VivaReal/ZAP, Imovelweb e a
# API do Mercado Livre respondem 403 para faixas de IP de datacenter, e os
# runners do GitHub Actions são datacenter. Essas fontes só produzem resultado
# a partir de uma conexão residencial.
#
#   python -m terreno.run --profile ci      (o que o GitHub Actions roda)
#   python -m terreno.run --profile local   (o que a sua máquina roda)
#
# O pgfn está nos dois perfis de propósito: a API pública responde, mas o host
# derruba a conexão sob rajada e pode estar bloqueando IP de datacenter. Se o
# run do Actions registrar "pgfn: 0 resultados" e o run local trouxer lotes,
# tire o pgfn do perfil ci.
perfis:
  ci: [brave, chavesnamao, pgfn]
  local: [olx, vivareal, mercadolivre, imovelweb, chavesnamao, pgfn, facebook]

# ---------------------------------------------------------------- orçamentos
# Limites rígidos, contabilizados em SQLite, para as cotas gratuitas.
orcamentos:
  brave_consultas_por_run: 100
  brave_consultas_por_mes: 2000     # cota gratuita da Brave
  apify_usd_por_mes: 5.00           # crédito gratuito da Apify
  max_paginas_por_fonte: 10
  max_paginas_novas: 200            # páginas visitadas pela camada Brave
  max_paginas_detalhe_por_fonte: 60
  max_paginas_enriquecimento: 80

# ---------------------------------------------------------------- saída
saida:
  # Anúncios vistos há mais tempo saem da página, mas continuam no banco para
  # o histórico de preço.
  manter_dias: 90
  top_n_no_alerta: 8
  # Nota mínima (0..1) para aparecer na página. 0 mostra tudo que passou nos
  # filtros rígidos de preço, área e localização.
  nota_minima: 0.15
