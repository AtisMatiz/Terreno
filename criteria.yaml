# Terreno — critérios ajustáveis da busca.
#
# Só o que muda de uma busca para outra fica aqui: tamanho, preço e localização.
# O *perfil* do imóvel procurado (água, benfeitorias, sossego, acesso, solo,
# mata, topografia, documentação) é estrutural e está em terreno/scoring.py,
# com pesos versionados e testáveis.

# ---------------------------------------------------------------- localização
# Preencha na granularidade que quiser:
#   estados   — obrigatório, dirige a busca nos portais
#   regiao    — opcional; se preenchida, filtra pelos municípios de data/regioes.yaml
#   municipios— opcional; se vazio, busca a região inteira (ou o estado inteiro)
localizacao:
  estados: [SP]
  regiao: "vale do paraiba"     # null para o estado inteiro
  municipios: []                # ex: [Monteiro Lobato, São Bento do Sapucaí]

  # Área de interesse principal. Não é só um filtro de raio: a distância até
  # este ponto entra na nota, então quanto mais perto, melhor a pontuação —
  # é o que faz Caçapava valer mais que Cunha sem excluir nenhuma das duas.
  # null desliga tanto o filtro de raio quanto o bônus de proximidade.
  centro: "Monteiro Lobato, SP"

  # Bônus de proximidade em 4 níveis (2026-08-13, traduzido a mão de 2 mapas
  # desenhados pelo dono -- ver SESSION_NOTES, ainda não confirmados município
  # a município, corrija livremente):
  #   nível 4 (o melhor de todos) -- estar exatamente em `centro` (Monteiro
  #     Lobato). Comparação por nome do município, não por distância: "estar
  #     em Monteiro Lobato" é uma categoria, não um raio.
  #   nível 3 (zona vermelha, "best zone") -- núcleo da serra ao redor do
  #     centro.
  #   nível 2 (zona laranja, "good zone") -- anel intermediário.
  #   nível 1 (zona azul, "total search zone") -- resto da área de busca; sem
  #     lista própria, cai na curva de distância contínua já existente
  #     (`ajuste_centro`), que segue valendo para qualquer município fora das
  #     duas listas abaixo.
  zona_melhor: [São Bento do Sapucaí, Sapucaí-Mirim, Pinhalzinho, Francisco Xavier]
  zona_boa: [Campos do Jordão, Pindamonhangaba, Taubaté, Tremembé, Ribeirão Grande]
  # Limite de sanidade, não o critério de escolha. A ordenação por proximidade
  # é feita pela nota (ver `proximidade_centro` em terreno/scoring.py), então o
  # raio existe só para cortar o que está claramente fora da região. Estava em
  # 60 km, o que excluía Cunha (~110 km) por completo — e o pedido era que Cunha
  # aparecesse valendo menos que Caçapava, não que desaparecesse. Um raio
  # apertado faz o filtro decidir o que a nota deveria decidir.
  raio_km: 150

# ---------------------------------------------------------------- tamanho
# Sempre em hectares. A conversão cuida do alqueire, que varia por estado:
#   alqueire paulista  = 2,42 ha   (SP, PR, RJ)
#   alqueire mineiro   = 4,84 ha   (MG, GO, BA — o dobro do paulista)
#   alqueire do norte  = 2,72 ha   (AM)
#   tarefa             = 0,3025 ha (BA e Nordeste)
area:
  min_ha: 2
  max_ha: 10

# ---------------------------------------------------------------- preço
preco:
  min: 100000
  max: 2000000

# Teto de R$ por hectare que **descarta** o anúncio de vez. null = sem teto.
# Diferente de `preco_por_ha` abaixo, que só muda nota e canal.
max_preco_por_ha: null

# Preço por hectare — o critério que o dono usa para separar oportunidade de
# anúncio caro, e que age em dois níveis de propósito:
#
#   ideal      — abaixo disso a nota sobe. É o alvo, não um limite.
#   teto_alerta— acima disso o anúncio **continua no site** mas não vai para o
#                Telegram. O objetivo é uma lista curta e boa no Telegram sem
#                perder nada da lista completa: descartar seria jogar fora um
#                imóvel que pode valer por outros motivos; mandar tudo seria
#                voltar ao problema de sempre.
preco_por_ha:
  ideal: 100000
  teto_alerta: 150000

# ---------------------------------------------------------------- fontes
fontes:
  olx: true
  vivareal: false     # desligado a pedido do usuário (2026-08-11): o portal
                      # apresenta problemas mesmo num navegador comum, então
                      # não é um caso de bloqueio a resolver do nosso lado.
  mercadolivre: false # desligado (2026-08-14): não é bloqueio nosso nem falta
                      # de credencial -- o OAuth funciona (token emitido com
                      # sucesso), mas o próprio endpoint `/sites/MLB/search`
                      # devolve 403 para qualquer app comum, medido e confirmado
                      # como uma restrição de plataforma recente e generalizada
                      # (múltiplos desenvolvedores relatando o mesmo, sem
                      # solução documentada -- exige whitelist manual do
                      # Mercado Livre). Nada a corrigir do nosso lado agora.
  chavesnamao: true
  imovelweb: false    # desligado (2026-08-12): nada medido resolve esse host,
                      # nem o desbloqueador pago (HTTP 422) — ver comentário em
                      # `perfis` abaixo. O que sobra vem da Brave (site:).
  wimoveis: false     # desligado (2026-08-12): recusado pelo ZenRows nos dois
                      # modos (rápido e com js_render) — 404 RESP002 limpo e
                      # consistente nos dois casos. Mesmo grupo (Navent) do
                      # imovelweb; ver comentário abaixo.
  pgfn: true          # leilões da PGFN (comprei.pgfn.gov.br) — ver nota nos perfis
  caixa: true         # imóveis retomados da Caixa (CSV público por estado)
  # Renomeado de "brave" (2026-08-17): rotação diária da SDB, hoje toda via
  # Tavily, não Brave -- ver terreno/sources/__init__.py.
  sdb_scan: true
  # Descoberta genérica de sites novos, separada do scan acima (2026-08-17)
  # para rodar como seu próprio job diário (`ci_novos`), decorrelacionado do
  # scan da SDB -- ver terreno/sources/brave.py e SESSION_NOTES.
  brave_novos: true
  # Varredura sem API da SDB imobiliária, 2x/semana (2026-08-17) -- ver
  # terreno/sources/imobiliaria_crawl.py e o perfil ci_crawl_imobiliaria.
  imobiliaria_crawl: true
  facebook: true

# Onde cada fonte roda. Só existe um lugar agora: o runner do GitHub Actions
# (`python -m terreno.run --profile ci`, o que o workflow roda). A execução
# manual local foi abandonada por decisão do dono (2026-08-12) — o
# desbloqueador pago e a escada de impressões digitais em `terreno/http.py`
# resolveram a maior parte do que antes só passava de um IP residencial, e o
# resto (`imovelweb`) não passa nem de lá.
#
# MEDIDO (não suposto) num runner real do GitHub Actions, run 31630009812,
# 2026-08-12, com `scripts/diagnostico.py`:
#   * pgfn   — curl_cffi (impersonate=chrome) resolve. Nunca tinha sido
#     tentado nesse caminho antes (só rodava depois de um 403, e o PGFN falha
#     como exceção) — corrigido, e a resposta apareceu na hora.
#   * olx    — bloqueia chrome/chrome124, mas responde 200 a safari/firefox.
#     `terreno/http.py` já tenta uma escada de navegadores (IMPERSONATE_ESCADA)
#     em vez de um só, então isso também já está coberto.
#   * wimoveis — recusado por tudo. Testado depois com o desbloqueador pago
#     (ZenRows) nos dois modos (rápido e com js_render, timeout de 100s) —
#     404 RESP002 limpo e imediato nos dois casos, não uma questão de tempo
#     de resposta. Desligado em `fontes.wimoveis` acima; sem lugar para
#     rodar agora, mesmo grupo (Navent) do imovelweb.
#   * imovelweb — recusado por tudo, incluindo o ZenRows (HTTP 422). Sem
#     lugar nenhum para rodar agora; ver `fontes.imovelweb` acima. O que
#     sobra vem da cobertura indireta da Brave (site:).
#   * mercadolivre — desligado (2026-08-14): não é bloqueio de IP nem falta
#     de credencial. Testado com ML_CLIENT_ID/ML_CLIENT_SECRET configurados: o
#     OAuth (client_credentials) funciona e emite token normalmente, mas o
#     endpoint de busca (`/sites/MLB/search`) devolve 403 mesmo assim — uma
#     restrição de plataforma recente e generalizada (vários desenvolvedores
#     relatando o mesmo, sem solução documentada, exige whitelist manual do
#     Mercado Livre). Sem correção possível do nosso lado agora; ver
#     `fontes.mercadolivre` acima.
#   * facebook — o mesmo: a chamada via Apify sai dos servidores da Apify,
#     nunca do nosso IP, então também nunca precisou de máquina local. Só o
#     reserva (`FB_COOKIES_FILE`, Playwright) exigia isso, e continua
#     simplesmente pulando quando esse arquivo não existe — o caso normal em
#     CI.
# `chavesnamao`, `caixa` e `brave` já respondiam do runner (chavesnamao e
# Brave por natureza; caixa via curl_cffi).
perfis:
  ci: [chavesnamao, caixa, pgfn, olx, facebook]
  # Job separado (2026-08-24): sdb_scan (Tavily) tirado do `ci` diário e posto
  # em seu próprio job, seg-sex -- não por custo (o cooldown semanal de cada
  # host já mantém o gasto real em ~3-5 consultas/mês de um teto de 900, ver
  # SESSION_NOTES), mas porque não há razão para rodar aos fins de semana algo
  # cujo próprio design é semanal por host. Ver .github/workflows/search_sdb.yml.
  ci_sdb: [sdb_scan]
  # Job separado (2026-08-17): só a descoberta genérica de sites novos, sem
  # visitar nada e sem os outros scrapers -- ver .github/workflows/search.yml
  # (job busca-novos-sites) e terreno/sources/brave.py.
  ci_novos: [brave_novos]
  # Job separado (2026-08-17), agora diário (2026-08-24 -- sem custo de API,
  # só tempo/rede, então não há razão pra ser 2x/semana): varre toda a SDB
  # imobiliária via crawl direto -- ver
  # .github/workflows/search_crawl_imobiliaria.yml e
  # terreno/sources/imobiliaria_crawl.py.
  ci_crawl_imobiliaria: [imobiliaria_crawl]

# Sites vasculhados pela camada Brave com `site:`. É assim que a busca cobre
# dezenas de portais e imobiliárias sem um scraper dedicado para cada um: a
# Brave é uma API com chave, então funciona do GitHub Actions mesmo nos sites
# que bloqueiam IP de datacenter. Acrescentar um domínio aqui custa 1 consulta
# por execução — muito mais barato do que manter mais um scraper.
#
# Esta lista é só a parte curada à mão. Sites que a Brave prova por conta
# própria serem especializados em vender imóveis (mais de uma extração real
# de listing, não uma página qualquer) entram automaticamente na tabela
# `sites_descobertos` do banco (ver `terreno/sources/brave_visit.py`) e passam
# a receber a mesma consulta `site:`, numa cadência semanal própria em vez de
# todo run — não precisam ser adicionados aqui.
sites_alvo:
  # portais nacionais
  - wimoveis.com.br
  - imovelweb.com.br
  - vivareal.com.br
  - zapimoveis.com.br
  - olx.com.br
  - chavesnamao.com.br
  # especializados em rural
  - imovelrural.com.br
  - fazendasdobrasil.com.br
  - ruralimoveis.com.br
  - fazendasbrasil.com.br
  - agroterras.com.br
  - imobiliariamaciel.com.br
  - terrasdamantiqueira.com
  - imoveisdamantiqueira.com
  - valeruralimoveis.com.br
  - baleeiroschmidt.com.br
  - saobentodosapucaiimoveis.com.br
  - videvale.com.br
  # leilões e bancos
  - venda-imoveis.caixa.gov.br
  - comprei.pgfn.gov.br
  - megaleiloes.com.br
  - zukerman.com.br
  - sodresantoro.com.br
  - superbid.net
  # redes de corretagem
  - century21.com.br
  - remax.com.br
  - lopes.com.br

# ---------------------------------------------------------------- orçamentos
# Limites rígidos, contabilizados em SQLite, para as cotas gratuitas.
orcamentos:
  # O plano da Brave TEM um teto mensal real de $ (bateu HTTP 402 em
  # 2026-08-13 -- ver Standing rules em SESSION_NOTES, a nota anterior de
  # "sem teto mensal" estava errada). `BRAVE_API_KEY_2` (2026-08-13) já dá
  # fallback automático quando a chave principal esgota, mas as duas
  # dividem o mesmo calendário mensal -- reduzido de 600 para 100 consultas
  # por execução (2026-08-16, a pedido do usuário) para esticar quantos dias
  # o par de chaves dura antes de bater o teto de novo, já que a chave 2
  # sozinha já tinha alcançado metade do próprio limite mensal.
  brave_consultas_por_run: 100
  # Job `ci_novos` (busca genérica de sites novos), separado do acima
  # (2026-08-17) -- mesmo teto mensal em `brave_queries`, orçamento de
  # consultas por execução próprio já que agora é uma execução própria.
  brave_consultas_por_run_novos: 100
  brave_consultas_por_mes: 1000000
  # Toda a rotação da SDB (as duas categorias, ver terreno/site_categoria.py)
  # usa Tavily em vez da Brave (2026-08-17, depois de um benchmark real contra
  # a varredura sem API mostrar Tavily 2,6x melhor em listings úteis e 40%
  # mais rápida -- ver SESSION_NOTES): `include_domains` aceita até 300 hosts
  # numa única consulta, contra o truque `site:` da Brave que gasta uma
  # consulta por host -- então mesmo consultando toda a rotação semanal de uma
  # vez, o custo real fica em poucos créditos por execução. Tavily free tier é
  # ~1000 créditos/mês; 900 deixa margem de segurança.
  tavily_consultas_por_mes: 900
  # US$ 5,00 é de fato o teto real por conta (confirmado no painel de billing
  # da própria Apify, 2026-08-24: "Usage $5.00 / $5.00", inteiro gasto em ~5
  # dias no Facebook Marketplace Scraper) -- a estimativa de 2026-08-24 de que
  # o teto real seria ~US$ 1,50 estava errada; o que estava errado era o
  # `USD_POR_ITEM` do ledger local (`facebook.py`), que só contava a taxa por
  # item do README e ignorava compute units/proxy, então parecia haver muito
  # mais margem do que existia de fato. Ver SESSION_NOTES 2026-08-24 (correção).
  apify_usd_por_mes: 5.00
  # Varredura sem API da SDB imobiliária (terreno/sources/imobiliaria_crawl.py,
  # job ci_crawl_imobiliaria, 2x/semana) -- sem custo de API, só tempo/rede, daí
  # sem teto mensal como os orçamentos acima.
  imobiliaria_max_candidatos: 40    # páginas candidatas por host (sitemap ou navegação)
  imobiliaria_timeout_pagina_s: 25
  imobiliaria_paralelismo: 20       # hosts varridos ao mesmo tempo
  max_paginas_por_fonte: 10
  # Sem teto de tempo ou de contagem para visitar candidatos do Brave: cada
  # execução visita a fila pendente inteira (terreno/sources/brave_visit.py),
  # o que a limita agora é só o timeout-minutes do job no GitHub Actions —
  # ver .github/workflows/search.yml. Rede é o gargalo, não CPU/memória do
  # runner, então o paralelismo pode ser alto sem custo real.
  brave_paralelismo: 50             # páginas candidatas buscadas ao mesmo tempo
  brave_timeout_pagina_s: 40        # tempo generoso por página até considerar "falha de acesso"
  brave_max_falhas: 2               # falhas de acesso seguidas (entre execuções) até mover o candidato para o arquivo frio (brave_frios)
  brave_max_fila_pendentes: 5000    # teto de segurança contra fila sem fim, não uma cota por execução
  max_paginas_detalhe_por_fonte: 60
  max_paginas_enriquecimento: 80

# ---------------------------------------------------------------- saída
saida:
  # Anúncios vistos há mais tempo saem da página, mas continuam no banco para
  # o histórico de preço.
  manter_dias: 90
  # Nota mínima (0..1) para aparecer na página. 0 mostra tudo que passou nos
  # filtros rígidos de preço, área e localização.
  nota_minima: 0.15

  # Nota mínima (0..100) para valer uma leitura das fotos por um modelo com
  # visão. Palavra-chave é grátis e roda em todo resultado; imagem custa por
  # anúncio, e a maioria dos anúncios nunca vai interessar — então esta etapa
  # olha só a lista curta. Num run com centenas de candidatos e oito aprovados,
  # é a diferença entre centenas de chamadas e oito. Precisa de ENABLE_LLM=1 e
  # ANTHROPIC_API_KEY; sem isso a etapa simplesmente não roda.
  nota_minima_imagem: 70

  # Só anúncios ainda disponíveis vão para o Telegram. Um anúncio já vendido
  # ou removido é verificado antes do aviso (terreno/disponibilidade.py).
  # "desconhecido" (falha de rede) conta como disponível de propósito: uma
  # instabilidade momentânea não pode apagar um imóvel bom.
  checar_disponibilidade: true
