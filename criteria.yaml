# Terreno — critérios ajustáveis da busca.
#
# Só o que muda de uma busca para outra fica aqui: tamanho, preço e localização.
# O *perfil* do imóvel procurado (água, benfeitorias, sossego, acesso, solo,
# mata, topografia, documentação) é estrutural e está em terreno/scoring.py,
# com pesos versionados e testáveis.

# ---------------------------------------------------------------- localização
# Preencha na granularidade que quiser:
#   estados   — obrigatório, dirige a busca nos portais
#   regiao    — opcional; se preenchida, filtra pelos municípios de data/regioes.yaml
#   municipios— opcional; se vazio, busca a região inteira (ou o estado inteiro)
localizacao:
  estados: [SP]
  regiao: "vale do paraiba"     # null para o estado inteiro
  municipios: []                # ex: [Monteiro Lobato, São Bento do Sapucaí]

  # Área de interesse principal. Não é só um filtro de raio: a distância até
  # este ponto entra na nota, então quanto mais perto, melhor a pontuação —
  # é o que faz Caçapava valer mais que Cunha sem excluir nenhuma das duas.
  # null desliga tanto o filtro de raio quanto o bônus de proximidade.
  centro: "Monteiro Lobato, SP"
  # Limite de sanidade, não o critério de escolha. A ordenação por proximidade
  # é feita pela nota (ver `proximidade_centro` em terreno/scoring.py), então o
  # raio existe só para cortar o que está claramente fora da região. Estava em
  # 60 km, o que excluía Cunha (~110 km) por completo — e o pedido era que Cunha
  # aparecesse valendo menos que Caçapava, não que desaparecesse. Um raio
  # apertado faz o filtro decidir o que a nota deveria decidir.
  raio_km: 150

# ---------------------------------------------------------------- tamanho
# Sempre em hectares. A conversão cuida do alqueire, que varia por estado:
#   alqueire paulista  = 2,42 ha   (SP, PR, RJ)
#   alqueire mineiro   = 4,84 ha   (MG, GO, BA — o dobro do paulista)
#   alqueire do norte  = 2,72 ha   (AM)
#   tarefa             = 0,3025 ha (BA e Nordeste)
area:
  min_ha: 2
  max_ha: 10

# ---------------------------------------------------------------- preço
preco:
  min: 100000
  max: 2000000

# Teto de R$ por hectare que **descarta** o anúncio de vez. null = sem teto.
# Diferente de `preco_por_ha` abaixo, que só muda nota e canal.
max_preco_por_ha: null

# Preço por hectare — o critério que o dono usa para separar oportunidade de
# anúncio caro, e que age em dois níveis de propósito:
#
#   ideal      — abaixo disso a nota sobe. É o alvo, não um limite.
#   teto_alerta— acima disso o anúncio **continua no site** mas não vai para o
#                Telegram. O objetivo é uma lista curta e boa no Telegram sem
#                perder nada da lista completa: descartar seria jogar fora um
#                imóvel que pode valer por outros motivos; mandar tudo seria
#                voltar ao problema de sempre.
preco_por_ha:
  ideal: 100000
  teto_alerta: 150000

# ---------------------------------------------------------------- fontes
fontes:
  olx: true
  vivareal: false     # desligado a pedido do usuário (2026-08-11): o portal
                      # apresenta problemas mesmo num navegador comum, então
                      # não é um caso de bloqueio a resolver do nosso lado.
  mercadolivre: true
  chavesnamao: true
  imovelweb: true
  wimoveis: true      # mesmo grupo (Navent) do imovelweb
  pgfn: true          # leilões da PGFN (comprei.pgfn.gov.br) — ver nota nos perfis
  caixa: true         # imóveis retomados da Caixa (CSV público por estado)
  brave: true
  facebook: true

# Onde cada fonte roda.
#
#   python -m terreno.run --profile ci      (o que o GitHub Actions roda)
#   python -m terreno.run --profile local   (o que a sua máquina roda, ./scripts/run_local.sh)
#
# MEDIDO (não suposto) num runner real do GitHub Actions, run 31630009812,
# 2026-08-12, com `scripts/diagnostico.py` — é essa medição, não IP de
# datacenter, que decide onde cada fonte roda hoje:
#   * pgfn   — curl_cffi (impersonate=chrome) resolve. Nunca tinha sido
#     tentado nesse caminho antes (só rodava depois de um 403, e o PGFN falha
#     como exceção) — corrigido, e a resposta apareceu na hora.
#   * olx    — bloqueia chrome/chrome124, mas responde 200 a safari/firefox.
#     `terreno/http.py` já tenta uma escada de navegadores (IMPERSONATE_ESCADA)
#     em vez de um só, então isso também já está coberto.
#   * wimoveis — nada grátis resolve; só o desbloqueador pago (ZenRows) passa.
#     Fica em `ci` porque a chave já está configurada nos secrets do repo.
#   * imovelweb — recusado por tudo, incluindo o ZenRows (HTTP 422). Fica só
#     em `local`; o que sobra vem da cobertura indireta da Brave.
#   * mercadolivre — nunca foi bloqueio de IP: a API exige OAuth
#     (client_credentials, ver terreno/sources/mercadolivre.py). Só entra em
#     `ci` quando ML_CLIENT_ID/ML_CLIENT_SECRET estiverem configurados.
# `chavesnamao`, `caixa` e `brave` já respondiam do runner (chavesnamao e
# Brave por natureza; caixa via curl_cffi) e continuam nos dois perfis.
perfis:
  ci: [brave, chavesnamao, caixa, pgfn, olx, wimoveis]
  local: [olx, mercadolivre, imovelweb, wimoveis, chavesnamao, pgfn, caixa, facebook]

# Sites vasculhados pela camada Brave com `site:`. É assim que a busca cobre
# dezenas de portais e imobiliárias sem um scraper dedicado para cada um: a
# Brave é uma API com chave, então funciona do GitHub Actions mesmo nos sites
# que bloqueiam IP de datacenter. Acrescentar um domínio aqui custa 1 consulta
# por execução — muito mais barato do que manter mais um scraper.
#
# Esta lista é só a parte curada à mão. Sites que a Brave prova por conta
# própria serem especializados em vender imóveis (mais de uma extração real
# de listing, não uma página qualquer) entram automaticamente na tabela
# `sites_descobertos` do banco (ver `terreno/sources/brave_visit.py`) e passam
# a receber a mesma consulta `site:`, numa cadência semanal própria em vez de
# todo run — não precisam ser adicionados aqui.
sites_alvo:
  # portais nacionais
  - wimoveis.com.br
  - imovelweb.com.br
  - vivareal.com.br
  - zapimoveis.com.br
  - olx.com.br
  - chavesnamao.com.br
  # especializados em rural
  - imovelrural.com.br
  - fazendasdobrasil.com.br
  - ruralimoveis.com.br
  - fazendasbrasil.com.br
  - agroterras.com.br
  # leilões e bancos
  - venda-imoveis.caixa.gov.br
  - comprei.pgfn.gov.br
  - megaleiloes.com.br
  - zukerman.com.br
  - sodresantoro.com.br
  - superbid.net
  # redes de corretagem
  - century21.com.br
  - remax.com.br
  - lopes.com.br

# ---------------------------------------------------------------- orçamentos
# Limites rígidos, contabilizados em SQLite, para as cotas gratuitas.
orcamentos:
  # O plano atual da Brave (confirmado no dashboard, 2026-08-11) não tem teto
  # mensal — só 50 requisições/segundo, e o discover() de hoje faz uma
  # consulta por vez, bem abaixo disso. O `brave_consultas_por_mes` antigo
  # (2000, da cota gratuita) não existe mais nesse plano; deixamos um número
  # alto em vez de remover o cálculo de _daily_allowance, então o teto real
  # que sobra é `brave_consultas_por_run`, que subiu de 100 para cobrir muito
  # mais lugares/templates por execução.
  brave_consultas_por_run: 600
  brave_consultas_por_mes: 1000000
  apify_usd_por_mes: 5.00           # crédito gratuito da Apify
  max_paginas_por_fonte: 10
  # Sem teto de tempo ou de contagem para visitar candidatos do Brave: cada
  # execução visita a fila pendente inteira (terreno/sources/brave_visit.py),
  # o que a limita agora é só o timeout-minutes do job no GitHub Actions —
  # ver .github/workflows/search.yml. Rede é o gargalo, não CPU/memória do
  # runner, então o paralelismo pode ser alto sem custo real.
  brave_paralelismo: 50             # páginas candidatas buscadas ao mesmo tempo
  brave_timeout_pagina_s: 40        # tempo generoso por página até considerar "falha de acesso"
  brave_max_falhas: 2               # falhas de acesso seguidas (entre execuções) até descartar o candidato
  brave_max_fila_pendentes: 5000    # teto de segurança contra fila sem fim, não uma cota por execução
  max_paginas_detalhe_por_fonte: 60
  max_paginas_enriquecimento: 80

# ---------------------------------------------------------------- saída
saida:
  # Anúncios vistos há mais tempo saem da página, mas continuam no banco para
  # o histórico de preço.
  manter_dias: 90
  top_n_no_alerta: 8
  # Nota mínima (0..1) para aparecer na página. 0 mostra tudo que passou nos
  # filtros rígidos de preço, área e localização.
  nota_minima: 0.15

  # Nota mínima (0..100) para valer uma leitura das fotos por um modelo com
  # visão. Palavra-chave é grátis e roda em todo resultado; imagem custa por
  # anúncio, e a maioria dos anúncios nunca vai interessar — então esta etapa
  # olha só a lista curta. Num run com centenas de candidatos e oito aprovados,
  # é a diferença entre centenas de chamadas e oito. Precisa de ENABLE_LLM=1 e
  # ANTHROPIC_API_KEY; sem isso a etapa simplesmente não roda.
  nota_minima_imagem: 70

  # Só anúncios ainda disponíveis vão para o Telegram. Um anúncio já vendido
  # ou removido é verificado antes do aviso (terreno/disponibilidade.py).
  # "desconhecido" (falha de rede) conta como disponível de propósito: uma
  # instabilidade momentânea não pode apagar um imóvel bom.
  checar_disponibilidade: true
