# Terreno — critérios ajustáveis da busca.
#
# Só o que muda de uma busca para outra fica aqui: tamanho, preço e localização.
# O *perfil* do imóvel procurado (água, benfeitorias, sossego, acesso, solo,
# mata, topografia, documentação) é estrutural e está em terreno/scoring.py,
# com pesos versionados e testáveis.

# ---------------------------------------------------------------- localização
# Preencha na granularidade que quiser:
#   estados   — obrigatório, dirige a busca nos portais
#   regiao    — opcional; se preenchida, filtra pelos municípios de data/regioes.yaml
#   municipios— opcional; se vazio, busca a região inteira (ou o estado inteiro)
localizacao:
  estados: [SP]
  regiao: "vale do paraiba"     # null para o estado inteiro
  municipios: []                # ex: [Monteiro Lobato, São Bento do Sapucaí]

  # Filtro por raio a partir de um ponto (opcional). null desliga.
  centro: null                  # ex: "Monteiro Lobato, SP"
  raio_km: 60

# ---------------------------------------------------------------- tamanho
# Sempre em hectares. A conversão cuida do alqueire, que varia por estado:
#   alqueire paulista  = 2,42 ha   (SP, PR, RJ)
#   alqueire mineiro   = 4,84 ha   (MG, GO, BA — o dobro do paulista)
#   alqueire do norte  = 2,72 ha   (AM)
#   tarefa             = 0,3025 ha (BA e Nordeste)
area:
  min_ha: 2
  max_ha: 10

# ---------------------------------------------------------------- preço
preco:
  min: 100000
  max: 2000000

# Teto opcional de R$ por hectare. null = sem teto.
max_preco_por_ha: null

# ---------------------------------------------------------------- fontes
fontes:
  olx: true
  vivareal: true
  mercadolivre: true
  chavesnamao: true
  imovelweb: true
  wimoveis: true      # mesmo grupo (Navent) do imovelweb
  pgfn: true          # leilões da PGFN (comprei.pgfn.gov.br) — ver nota nos perfis
  caixa: true         # imóveis retomados da Caixa (CSV público por estado)
  brave: true
  facebook: true

# Onde cada fonte roda. Medido, não suposto: OLX, VivaReal/ZAP, Imovelweb, a
# API do Mercado Livre, o Facebook e o PGFN bloqueiam faixas de IP de
# datacenter (os runners do GitHub Actions são datacenter) — cada um com uma
# assinatura de bloqueio diferente (403, timeout de conexão, CAPTCHA), mas o
# efeito é o mesmo: essas fontes só produzem resultado a partir de uma conexão
# residencial. O PGFN em especial derruba a conexão por timeout de rede
# (`ConnectTimeoutError`/`SSLZeroReturnError`), não por 403 — confirmado em
# runs reais, então não é um caso de "tentar de novo com outro fingerprint TLS".
#
#   python -m terreno.run --profile ci      (o que o GitHub Actions roda)
#   python -m terreno.run --profile local   (o que a sua máquina roda, ./scripts/run_local.sh)
#
# Lista canônica de fontes bloqueadas em datacenter → só em `local`:
#   olx, vivareal, mercadolivre, imovelweb, wimoveis, pgfn, facebook
# `chavesnamao`, `caixa` e `brave` já responderam OK do runner do Actions
# (chavesnamao e Brave por natureza; caixa via curl_cffi, ver Known bugs em
# SESSION_NOTES.md) e por isso ficam em `ci` também.
perfis:
  ci: [brave, chavesnamao, caixa]
  local: [olx, vivareal, mercadolivre, imovelweb, wimoveis, chavesnamao, pgfn, caixa, facebook]

# Sites vasculhados pela camada Brave com `site:`. É assim que a busca cobre
# dezenas de portais e imobiliárias sem um scraper dedicado para cada um: a
# Brave é uma API com chave, então funciona do GitHub Actions mesmo nos sites
# que bloqueiam IP de datacenter. Acrescentar um domínio aqui custa 1 consulta
# por execução — muito mais barato do que manter mais um scraper.
#
# Esta lista é só a parte curada à mão. Sites que a Brave prova por conta
# própria serem especializados em vender imóveis (mais de uma extração real
# de listing, não uma página qualquer) entram automaticamente na tabela
# `sites_descobertos` do banco (ver `terreno/sources/brave_visit.py`) e passam
# a receber a mesma consulta `site:`, numa cadência semanal própria em vez de
# todo run — não precisam ser adicionados aqui.
sites_alvo:
  # portais nacionais
  - wimoveis.com.br
  - imovelweb.com.br
  - vivareal.com.br
  - zapimoveis.com.br
  - olx.com.br
  - chavesnamao.com.br
  # especializados em rural
  - imovelrural.com.br
  - fazendasdobrasil.com.br
  - ruralimoveis.com.br
  - fazendasbrasil.com.br
  - agroterras.com.br
  # leilões e bancos
  - venda-imoveis.caixa.gov.br
  - comprei.pgfn.gov.br
  - megaleiloes.com.br
  - zukerman.com.br
  - sodresantoro.com.br
  - superbid.net
  # redes de corretagem
  - century21.com.br
  - remax.com.br
  - lopes.com.br

# ---------------------------------------------------------------- orçamentos
# Limites rígidos, contabilizados em SQLite, para as cotas gratuitas.
orcamentos:
  # O plano atual da Brave (confirmado no dashboard, 2026-08-11) não tem teto
  # mensal — só 50 requisições/segundo, e o discover() de hoje faz uma
  # consulta por vez, bem abaixo disso. O `brave_consultas_por_mes` antigo
  # (2000, da cota gratuita) não existe mais nesse plano; deixamos um número
  # alto em vez de remover o cálculo de _daily_allowance, então o teto real
  # que sobra é `brave_consultas_por_run`, que subiu de 100 para cobrir muito
  # mais lugares/templates por execução.
  brave_consultas_por_run: 600
  brave_consultas_por_mes: 1000000
  apify_usd_por_mes: 5.00           # crédito gratuito da Apify
  max_paginas_por_fonte: 10
  # Sem teto de tempo ou de contagem para visitar candidatos do Brave: cada
  # execução visita a fila pendente inteira (terreno/sources/brave_visit.py),
  # o que a limita agora é só o timeout-minutes do job no GitHub Actions —
  # ver .github/workflows/search.yml. Rede é o gargalo, não CPU/memória do
  # runner, então o paralelismo pode ser alto sem custo real.
  brave_paralelismo: 50             # páginas candidatas buscadas ao mesmo tempo
  brave_timeout_pagina_s: 40        # tempo generoso por página até considerar "falha de acesso"
  brave_max_falhas: 2               # falhas de acesso seguidas (entre execuções) até descartar o candidato
  brave_max_fila_pendentes: 5000    # teto de segurança contra fila sem fim, não uma cota por execução
  max_paginas_detalhe_por_fonte: 60
  max_paginas_enriquecimento: 80

# ---------------------------------------------------------------- saída
saida:
  # Anúncios vistos há mais tempo saem da página, mas continuam no banco para
  # o histórico de preço.
  manter_dias: 90
  top_n_no_alerta: 8
  # Nota mínima (0..1) para aparecer na página. 0 mostra tudo que passou nos
  # filtros rígidos de preço, área e localização.
  nota_minima: 0.15
