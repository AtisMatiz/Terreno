<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terreno — ofertas encontradas</title>
<style>
  :root{
    --bg:#f6f5f2; --surface:#fff; --border:#e2e0da; --text:#1c1b18;
    --muted:#6d6a62; --accent:#3f6b3f; --accent-soft:#eaf1ea;
    --new:#2f6f4f; --drop:#a8442a; --warn:#8a6d2f;
    --bar:#cfd9cd; --bar-fill:#5d8c5d;
    --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --surface:#1c1f24; --border:#2c3037; --text:#e8e6e1;
      --muted:#9a978f; --accent:#8fbf8f; --accent-soft:#22301f;
      --new:#8fd6ae; --drop:#e79c85; --warn:#d8bd7e;
      --bar:#2c3037; --bar-fill:#6f9c6f; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --surface:#1c1f24; --border:#2c3037; --text:#e8e6e1;
    --muted:#9a978f; --accent:#8fbf8f; --accent-soft:#22301f;
    --new:#8fd6ae; --drop:#e79c85; --warn:#d8bd7e;
    --bar:#2c3037; --bar-fill:#6f9c6f; --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 18px 12px;border-bottom:1px solid var(--border);
    background:var(--surface);position:sticky;top:0;z-index:10}
  h1{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
  .meta{color:var(--muted);font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  select,input,button{font:inherit;padding:6px 9px;border:1px solid var(--border);
    border-radius:7px;background:var(--bg);color:var(--text)}
  input[type=search]{min-width:190px;flex:1}
  button{cursor:pointer}
  button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  main{padding:16px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1500px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:11px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .card.oculto{opacity:.34}
  .thumb{aspect-ratio:4/3;background:var(--accent-soft);object-fit:cover;width:100%;display:block}
  .semimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px}
  .corpo{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .titulo{font-weight:600;font-size:14px;line-height:1.35;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .titulo a{color:inherit;text-decoration:none}
  .titulo a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
  .preco{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .dados{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--muted)}
  .dados span{background:var(--bg);border:1px solid var(--border);
    border-radius:20px;padding:1px 8px;white-space:nowrap}
  .selos{display:flex;gap:5px;flex-wrap:wrap;min-height:0}
  .selo{font-size:11px;font-weight:650;border-radius:5px;padding:1px 6px;
    text-transform:uppercase;letter-spacing:.03em}
  .s-novo{background:var(--accent-soft);color:var(--new)}
  .s-baixa{background:var(--accent-soft);color:var(--drop)}
  .nota{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .nota b{color:var(--text);font-size:13px}
  .barras{display:grid;grid-template-columns:auto 1fr;gap:3px 7px;
    font-size:11px;color:var(--muted);align-items:center}
  .barra{height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--bar-fill)}
  .provas{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
  .provas .alerta{color:var(--warn)}
  .rodape{display:flex;justify-content:space-between;align-items:center;
    margin-top:auto;padding-top:8px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted)}
  .rodape a{color:var(--accent);font-weight:600;text-decoration:none}
  .btn-detalhe,.x{background:none;border:none;color:var(--muted);cursor:pointer;
    padding:2px 5px;font-size:12px}
  .vazio{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px}
  footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
  .aviso{margin:12px auto 0;padding:9px 12px;border-radius:8px;font-size:13px;
    background:var(--accent-soft);color:var(--text);border:1px solid var(--border);
    max-width:1500px}
  #config{margin-top:12px;padding:12px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);display:flex;flex-direction:column;gap:9px}
  #config .linha{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
  #config label{display:flex;flex-direction:column;gap:3px;font-size:12px;
    color:var(--muted);flex:1;min-width:130px}
  #config label.check{flex-direction:row;align-items:center;gap:5px;flex:0 0 auto}
  #config input,#config select{width:100%}
  #config button[type=submit]{background:var(--accent-soft);border-color:var(--accent);
    color:var(--accent);font-weight:600;flex:0 0 auto}
  #config .dica{font-size:12px;color:var(--muted)}
  #config .resultado{font-size:13px;padding:7px 10px;border-radius:7px;
    border:1px solid var(--border);background:var(--surface)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <h1>Terreno</h1>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="filtrar por texto, município…" autocomplete="off">
    <select id="ordem">
      <option value="nota">Melhor pontuação</option>
      <option value="agua">Mais água</option>
      <option value="recentes">Mais recentes</option>
      <option value="preco_asc">Preço ↑</option>
      <option value="preco_desc">Preço ↓</option>
      <option value="ppha_asc">R$/ha ↑</option>
      <option value="area_desc">Área ↓</option>
      <option value="area_asc">Área ↑</option>
    </select>
    <select id="uf"><option value="">Todos os estados</option></select>
    <select id="municipio"><option value="">Todos os municípios</option></select>
    <select id="fonte"><option value="">Todas as fontes</option></select>
    <button id="soNovos">Só novos</button>
    <button id="verOcultos">Ver ocultos</button>
    <button id="abrirConfig">⚙ Configurar busca</button>
  </div>

  <form id="config" hidden>
    <div class="linha">
      <label>Estados<input id="cEstados" placeholder="SP, MG"></label>
      <label>Região<input id="cRegiao" placeholder="vale do paraiba"></label>
      <label>Municípios<input id="cMunicipios" placeholder="vazio = região inteira"></label>
    </div>
    <div class="linha">
      <label>Área mín. (ha)<input id="cAreaMin" type="number" step="0.5" min="0"></label>
      <label>Área máx. (ha)<input id="cAreaMax" type="number" step="0.5" min="0"></label>
      <label>Preço mín. (R$)<input id="cPrecoMin" type="number" step="10000" min="0"></label>
      <label>Preço máx. (R$)<input id="cPrecoMax" type="number" step="10000" min="0"></label>
    </div>
    <div class="linha">
      <label>Perfil de fontes
        <select id="cPerfil">
          <option value="ci">ci — Brave, Chaves na Mão, PGFN</option>
          <option value="local">local — portais + Facebook (só da sua máquina)</option>
        </select>
      </label>
      <label>Senha<input id="cSenha" type="password" placeholder="TERRENO_SENHA"></label>
      <label class="check"><input id="cSalvar" type="checkbox"> gravar como padrão</label>
      <button type="submit" id="cRodar">Rodar busca agora</button>
    </div>
    <div class="dica">Área sempre em hectares. 1 alqueire paulista = 2,42 ha;
      1 alqueire mineiro = 4,84 ha. Deixe municípios vazio para buscar a região
      inteira, e região vazia para o estado inteiro.</div>
    <div id="cAviso" class="resultado" hidden></div>
  </form>
</header>

<div class="aviso" id="aviso" hidden></div>
<main id="grade"></main>
<footer id="rodape"></footer>

<script id="dados" type="application/json">{"generated_at": "10/08/2026 às 21:49", "listings": [], "new_count": 0, "sources": ["pgfn", "chavesnamao", "caixa", "brave"], "warnings": ["pgfn: 0 resultados", "caixa: 0 resultados", "brave: 0 resultados"], "criterios": {"estados": ["SP"], "regiao": "vale do paraiba", "municipios": [], "area_min": 2.0, "area_max": 10.0, "preco_min": 100000.0, "preco_max": 2000000.0}}</script>
<script>
(function(){
  const dados = JSON.parse(document.getElementById('dados').textContent);
  const itens = dados.listings;
  const grade = document.getElementById('grade');
  const CHAVE_OCULTOS = 'terreno:ocultos';
  let ocultos = new Set(JSON.parse(localStorage.getItem(CHAVE_OCULTOS) || '[]'));
  let verOcultos = false, soNovos = false;
  const abertos = new Set();

  const brl = n => n == null ? '—' : 'R$ ' + Math.round(n).toLocaleString('pt-BR');
  const ha  = n => n == null ? 'área n/d'
    : (n >= 1 ? n.toLocaleString('pt-BR',{maximumFractionDigits:1}) : n.toFixed(2)) + ' ha';
  const pct = n => Math.round((n || 0) * 100) + '%';
  const agua = it => (it.dimensoes && it.dimensoes.agua ? it.dimensoes.agua.nota : 0);

  document.getElementById('meta').textContent =
    `${itens.length} ofertas · ${dados.new_count} nova(s) · atualizado em ${dados.generated_at}`;
  document.getElementById('rodape').textContent =
    `Fontes: ${dados.sources.join(', ')} · gerado automaticamente`;

  if (dados.warnings && dados.warnings.length) {
    const a = document.getElementById('aviso');
    a.hidden = false;
    a.textContent = '⚠ ' + dados.warnings.join(' · ');
  }

  for (const [id, campo] of [['uf','uf'], ['municipio','municipality'], ['fonte','source']]) {
    const sel = document.getElementById(id);
    [...new Set(itens.map(i => i[campo]).filter(Boolean))]
      .sort((a,b) => a.localeCompare(b,'pt-BR'))
      .forEach(v => sel.add(new Option(v, v)));
  }

  const ordenadores = {
    nota:       (a,b) => b.score - a.score,
    agua:       (a,b) => agua(b) - agua(a) || b.score - a.score,
    recentes:   (a,b) => (b.first_seen||'').localeCompare(a.first_seen||''),
    preco_asc:  (a,b) => (a.price ?? Infinity) - (b.price ?? Infinity),
    preco_desc: (a,b) => (b.price ?? -1) - (a.price ?? -1),
    ppha_asc:   (a,b) => (a.price_per_ha ?? Infinity) - (b.price_per_ha ?? Infinity),
    area_desc:  (a,b) => (b.area_ha ?? -1) - (a.area_ha ?? -1),
    area_asc:   (a,b) => (a.area_ha ?? Infinity) - (b.area_ha ?? Infinity),
  };

  function barras(it){
    const dims = it.dimensoes || {};
    // Heaviest criteria first — the order the buyer actually cares about.
    const ordem = ['agua','benfeitorias','mata','topografia','silencio',
                   'acessibilidade','regularizacao','fertilidade','distancia'];
    return ordem.filter(k => dims[k]).map(k => {
      const d = dims[k];
      return `<span>${d.rotulo}</span>
              <span class="barra" title="${d.rotulo}: ${pct(d.nota)} (peso ${d.peso})">
                <i style="width:${pct(d.nota)}"></i></span>`;
    }).join('');
  }

  function cartao(it){
    const el = document.createElement('article');
    el.className = 'card' + (ocultos.has(it.key) ? ' oculto' : '');
    const aberto = abertos.has(it.key);
    const img = it.image
      ? `<img class="thumb" src="${it.image}" loading="lazy" alt=""
             onerror="this.replaceWith(Object.assign(document.createElement('div'),
             {className:'thumb semimg',textContent:'🗺️'}))">`
      : `<div class="thumb semimg">🗺️</div>`;
    const selos = [
      it.is_new ? '<span class="selo s-novo">novo</span>' : '',
      it.price_drop && it.price_drop < 0
        ? `<span class="selo s-baixa">baixou ${brl(Math.abs(it.price_drop))}</span>` : '',
    ].join('');
    const onde = [it.municipality, it.uf].filter(Boolean).join('/');
    const provas = (it.reasons || []).map(r =>
      `<span class="${r.startsWith('⚠') ? 'alerta' : ''}">${r}</span>`).join('');

    el.innerHTML = `
      ${img}
      <div class="corpo">
        <div class="selos">${selos}</div>
        <h2 class="titulo"><a href="${it.url}" target="_blank" rel="noopener">
          ${it.title || 'sem título'}</a></h2>
        <div class="preco">${brl(it.price)}</div>
        <div class="dados">
          <span>${ha(it.area_ha)}</span>
          ${it.price_per_ha ? `<span>${brl(it.price_per_ha)}/ha</span>` : ''}
          ${onde ? `<span>${onde}</span>` : ''}
        </div>
        <div class="nota">pontuação <b>${pct(it.score)}</b>
          <button class="btn-detalhe">${aberto ? 'ocultar detalhe' : 'ver detalhe'}</button>
        </div>
        <div class="barras" ${aberto ? '' : 'hidden'}>${barras(it)}</div>
        <div class="provas" ${aberto ? '' : 'hidden'}>${provas}</div>
        <div class="rodape">
          <a href="${it.url}" target="_blank" rel="noopener">${it.source} ↗</a>
          <button class="x" title="ocultar esta oferta">✕</button>
        </div>
      </div>`;

    el.querySelector('.btn-detalhe').onclick = () => {
      abertos.has(it.key) ? abertos.delete(it.key) : abertos.add(it.key);
      desenhar();
    };
    el.querySelector('.x').onclick = () => {
      ocultos.has(it.key) ? ocultos.delete(it.key) : ocultos.add(it.key);
      localStorage.setItem(CHAVE_OCULTOS, JSON.stringify([...ocultos]));
      desenhar();
    };
    return el;
  }

  function desenhar(){
    const q = document.getElementById('q').value.toLowerCase().trim();
    const uf = document.getElementById('uf').value;
    const mun = document.getElementById('municipio').value;
    const fonte = document.getElementById('fonte').value;
    let linhas = itens.filter(i =>
      (verOcultos || !ocultos.has(i.key)) &&
      (!soNovos || i.is_new) &&
      (!uf || i.uf === uf) &&
      (!mun || i.municipality === mun) &&
      (!fonte || i.source === fonte) &&
      (!q || `${i.title} ${i.municipality} ${i.description}`.toLowerCase().includes(q))
    );
    linhas.sort(ordenadores[document.getElementById('ordem').value]);
    grade.replaceChildren(...(linhas.length
      ? linhas.map(cartao)
      : [Object.assign(document.createElement('div'),
          {className:'vazio', textContent:'Nenhuma oferta corresponde a esses filtros.'})]));
  }

  ['q','ordem','uf','municipio','fonte'].forEach(id =>
    document.getElementById(id).addEventListener('input', desenhar));
  document.getElementById('soNovos').onclick = e => {
    soNovos = !soNovos; e.target.classList.toggle('on', soNovos); desenhar();
  };
  document.getElementById('verOcultos').onclick = e => {
    verOcultos = !verOcultos; e.target.classList.toggle('on', verOcultos); desenhar();
  };
  desenhar();

  // ---------------------------------------------------------- painel
  // A página é estática. Rodar uma busca significa pedir à função serverless
  // (/api/disparar) que chame o GitHub Actions — o token do GitHub fica lá,
  // nunca no navegador. Sem a função publicada, o painel avisa e não quebra.
  const cfg = dados.criterios || {};
  const $ = id => document.getElementById(id);
  const form = $('config');

  $('cEstados').value    = (cfg.estados || []).join(', ');
  $('cRegiao').value     = cfg.regiao || '';
  $('cMunicipios').value = (cfg.municipios || []).join(', ');
  $('cAreaMin').value    = cfg.area_min ?? '';
  $('cAreaMax').value    = cfg.area_max ?? '';
  $('cPrecoMin').value   = cfg.preco_min ?? '';
  $('cPrecoMax').value   = cfg.preco_max ?? '';

  $('abrirConfig').onclick = e => {
    form.hidden = !form.hidden;
    e.target.classList.toggle('on', !form.hidden);
  };

  const lista = v => v.split(',').map(s => s.trim()).filter(Boolean);
  const num = v => v === '' ? undefined : Number(v);

  form.onsubmit = async ev => {
    ev.preventDefault();
    const aviso = $('cAviso');
    aviso.hidden = false;
    aviso.textContent = 'Disparando…';
    $('cRodar').disabled = true;

    const criterios = {
      localizacao: {
        estados: lista($('cEstados').value).map(s => s.toUpperCase()),
        regiao: $('cRegiao').value.trim() || null,
        municipios: lista($('cMunicipios').value),
      },
      area:  {min_ha: num($('cAreaMin').value), max_ha: num($('cAreaMax').value)},
      preco: {min: num($('cPrecoMin').value),   max: num($('cPrecoMax').value)},
    };

    try {
      const r = await fetch('/api/disparar', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          senha: $('cSenha').value,
          perfil: $('cPerfil').value,
          salvar: $('cSalvar').checked,
          criterios,
        }),
      });
      const d = await r.json().catch(() => ({}));
      aviso.textContent = r.ok
        ? '✓ ' + (d.mensagem || 'Busca disparada.')
        : '✕ ' + (d.erro || `Falhou (HTTP ${r.status})`) + (d.detalhe ? ` — ${d.detalhe}` : '');
    } catch (err) {
      aviso.textContent =
        '✕ Não foi possível falar com /api/disparar. ' +
        'Isso é esperado se a página estiver aberta do disco ou no GitHub Pages — ' +
        'a função só existe na Vercel.';
    } finally {
      $('cRodar').disabled = false;
    }
  };
})();
</script>
</body>
</html>
