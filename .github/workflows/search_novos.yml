name: terreno busca novos sites

# Job separado da busca principal (2026-08-17): só a descoberta genérica de
# sites novos para a SDB (sites_descobertos) -- ver terreno/sources/brave.py
# (fetch_novos) e criteria.yaml (perfil ci_novos). Não encadeado por
# workflow_run: os dois ainda commitam data/terreno.sqlite3 na mesma branch,
# então o grupo de concurrency abaixo continua sendo o que garante que um
# espera o outro terminar em vez de os dois pushes colidirem num conflito
# binário irreconciliável -- mesmo se um dia um dos dois atrasar e os dois
# horários se aproximarem.
#
# Semanal, não diário (2026-08-24): o catálogo de sites relevantes para a
# região cresce devagar (uma nova imobiliária/portal por mês seria muito),
# então gastar cota da Brave nisso todo dia era a definição de orçamento
# metrificado gasto num alvo que quase nunca muda de um dia pro outro. Um
# segundo caminho de descoberta foi somado (2026-08-24): uma Routine diária
# via Claude Code + Haiku que busca na web e acrescenta hosts novos direto em
# `criteria.yaml`'s `sites_alvo` -- sem custo de API nenhum. Este job semanal
# fica como um segundo método, não redundante por completo (métodos de busca
# diferentes acham coisas diferentes), a um custo agora ~4x menor que o
# diário original.

on:
  schedule:
    - cron: "15 8 * * 1"   # toda segunda, 08:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terreno-search
  cancel-in-progress: false

jobs:
  buscar-novos-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Buscar sites novos (SDB)
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BRAVE_API_KEY_2: ${{ secrets.BRAVE_API_KEY_2 }}
        run: python -m terreno.run --profile ci_novos

      - name: Commit results
        run: |
          git config user.name  "terreno-bot"
          git config user.email "terreno-bot@users.noreply.github.com"
          git add data/terreno.sqlite3
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: busca de sites novos $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** i))
            done
          fi
