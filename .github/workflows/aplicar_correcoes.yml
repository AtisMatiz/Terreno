name: terreno aplicar correções

# Disparado por api/editar.js (botão "Editar" do site) logo após gravar
# data/correcoes.json: aplica a correção, recalcula a nota global do anúncio
# e republica o site. Sem isto, a nota só seria recalculada na próxima busca
# agendada (até um dia depois da edição).

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Mesmo grupo das outras buscas: todas commitam data/terreno.sqlite3 na mesma
# branch, e o grupo é o que impede dois pushes de colidirem num conflito
# binário. Vários cliques de edição seguidos enfileiram em vez de se perder.
concurrency:
  group: terreno-search
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Aplicar correções e recalcular notas
        run: python scripts/aplicar_correcoes.py
      - name: Commit results
        run: |
          git config user.name  "terreno-bot"
          git config user.email "terreno-bot@users.noreply.github.com"
          git add data/terreno.sqlite3 site/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: correções manuais aplicadas $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** i))
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: aplicar
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
