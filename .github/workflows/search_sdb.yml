name: terreno sdb (Tavily)

# Job separado (2026-08-24): sdb_scan (rotação da SDB via Tavily,
# terreno/sources/tavily_discover.py) tirado do `ci` diário para o seu
# próprio job seg-sex -- não por custo (o cooldown semanal de cada host já
# mantém o gasto real baixo, ~3-5 consultas/mês de um teto de 900, ver
# SESSION_NOTES 2026-08-24), mas porque não há razão pra rodar aos fins de
# semana algo cujo próprio design já é semanal por host.
#
# `varredura_completa: true` ignora o cooldown de 7 dias e consulta TODO
# host promovido nesta execução (via TAVILY_SDB_VARREDURA_COMPLETA=1) --
# existe para a comparação pontual Tavily x crawler sem API (SESSION_NOTES
# 2026-08-24), não para uso semanal normal.

on:
  schedule:
    # 08:20 UTC = 05:20 America/Sao_Paulo. Third stage of the nightly chain
    # (2026-09-09, era 09:00 UTC): after search_crawl_imobiliaria, before the
    # main search.yml run -- see that file's cron comment for the full
    # ordering rationale.
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      varredura_completa:
        description: "Ignorar o cooldown de 7 dias e consultar toda a SDB agora"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: terreno-search
  cancel-in-progress: false

jobs:
  sdb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sdb_scan
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TERRENO_PAGE_URL: ${{ vars.TERRENO_PAGE_URL }}
          TAVILY_SDB_VARREDURA_COMPLETA: ${{ inputs.varredura_completa == 'true' && '1' || '' }}
        run: python -m terreno.run --profile ci_sdb

      - name: Commit results
        run: |
          git config user.name  "terreno-bot"
          git config user.email "terreno-bot@users.noreply.github.com"
          git add data/terreno.sqlite3 site/ criteria.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sdb scan (tavily) $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((2 ** i))
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sdb
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The Pages deploy is a nicety, not the job: the search already committed its
      # results by now. On 2026-11-04 a GitHub Pages incident left a deployment
      # "in progress" and every run after it failed here ("Please cancel ... first
      # or wait for it to complete") -- two failure e-mails for a search that had
      # in fact worked. So: one retry after a wait, and a warning, not a failure,
      # if Pages is still busy.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pages ocupado -- espera 4 min para tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 240
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pages indisponível (a busca em si funcionou)
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: echo "::warning::GitHub Pages recusou o deploy duas vezes; os resultados já estão commitados no repositório."
